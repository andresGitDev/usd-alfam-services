name: Bump version

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    # Evita el bucle: el commit del bump lo hace el bot y lleva [skip ci].
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Incrementar buildRevision
        id: bump
        run: echo "version=$(node scripts/bump-version.js)" >> "$GITHUB_OUTPUT"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata.json
          git commit -m "chore: version ${{ steps.bump.outputs.version }} [skip ci]"
          git push
